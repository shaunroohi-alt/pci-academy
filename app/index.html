<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         values under the notch and home indicator; without it they resolve to
         0 and content sits beneath the system UI. user-scalable=no stops the
         pinch-zoom that makes a packaged app feel like a web page. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#f3f2f2" />
    <meta name="description" content="The Psycho Creative Intelligence Academy daily practice — one exercise, one reflection, one honest sentence about your day." />
    <title>PCI Academy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
