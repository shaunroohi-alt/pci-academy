name: lee-meet-ii

# Builds, validates and packages the Lee-Meet II plug-in (plugins/lee-meet-ii).
#   - pull requests / pushes touching the plug-in: build, DSP tests, pluginval, auval
#   - tags lee-meet-ii-v*: the same, then a GitHub Release with AU/VST3 zips for
#     macOS (universal arm64 + x86_64), Windows and Linux.
# Logic Pro loads the AU; VST3 covers Ableton, Cubase, Studio One, Reaper, FL, Bitwig.

on:
  push:
    branches: [main]
    tags: ['lee-meet-ii-v*']
    paths:
      - 'plugins/lee-meet-ii/**'
      - '.github/workflows/lee-meet-ii.yml'
  pull_request:
    paths:
      - 'plugins/lee-meet-ii/**'
      - '.github/workflows/lee-meet-ii.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_DIR: plugins/lee-meet-ii
  BUILD_DIR: plugins/lee-meet-ii/build
  ARTEFACTS: plugins/lee-meet-ii/build/LeeMeetII_artefacts/Release
  PRODUCT: Lee-Meet II
  JUCE_TAG: 8.0.4
  AU_TYPE: aufx
  AU_SUBTYPE: Lmt2
  AU_MANU: MPau

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      # secrets are not readable from a step-level `if`, so mirror their presence here
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos,   os: macos-14,     pluginval: pluginval_macOS.zip,   pv_bin: pluginval.app/Contents/MacOS/pluginval }
          - { name: windows, os: windows-2022, pluginval: pluginval_Windows.zip, pv_bin: pluginval.exe }
          - { name: linux,   os: ubuntu-24.04, pluginval: pluginval_Linux.zip,   pv_bin: pluginval }

    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config xvfb zip \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libgl1-mesa-dev libcurl4-openssl-dev

      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: juce
          key: juce-${{ env.JUCE_TAG }}-v1

      - name: Fetch JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        shell: bash
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git juce

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S "$PLUGIN_DIR" -B "$BUILD_DIR" -G "Visual Studio 17 2022" -A x64 \
              -DFETCHCONTENT_SOURCE_DIR_JUCE="$GITHUB_WORKSPACE/juce"
          else
            cmake -S "$PLUGIN_DIR" -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release \
              -DFETCHCONTENT_SOURCE_DIR_JUCE="$GITHUB_WORKSPACE/juce"
          fi

      - name: Build
        shell: bash
        run: cmake --build "$BUILD_DIR" --config Release --parallel 4

      - name: DSP tests
        shell: bash
        run: ctest --test-dir "$BUILD_DIR" -C Release --output-on-failure

      # ---- macOS: ad-hoc sign (arm64 refuses to load unsigned code), then Apple's AU validator,
      #      which is what Logic Pro runs before it lets an Audio Unit in.
      - name: Ad-hoc sign and run auval
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --deep --sign - "$ARTEFACTS/AU/$PRODUCT.component"
          codesign --force --deep --sign - "$ARTEFACTS/VST3/$PRODUCT.vst3"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ARTEFACTS/AU/$PRODUCT.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          for attempt in 1 2 3 4 5 6; do
            if auval -strict -v "$AU_TYPE" "$AU_SUBTYPE" "$AU_MANU"; then exit 0; fi
            echo "auval attempt $attempt failed, waiting for the component registrar..."
            sleep 5
          done
          exit 1

      - name: Developer ID sign and notarize (only when signing secrets are configured)
        if: runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN=build.keychain
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > cert.p12
          security create-keychain -p ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          for bundle in "$ARTEFACTS/AU/$PRODUCT.component" "$ARTEFACTS/VST3/$PRODUCT.vst3"; do
            codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$bundle"
            ditto -c -k --keepParent "$bundle" notarize.zip
            xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$bundle"
            rm notarize.zip
          done

      # ---- Tracktion pluginval: host-side validation of the VST3 (and the AU on macOS)
      - name: pluginval
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL -o pv.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}"
          mkdir -p pv && (cd pv && unzip -q ../pv.zip)
          PV="pv/${{ matrix.pv_bin }}"
          chmod +x "$PV" || true
          run_pv() {
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a "$PV" --strictness-level 5 --timeout-ms 300000 --validate "$1"
            else
              "$PV" --strictness-level 5 --timeout-ms 300000 --validate "$1"
            fi
          }
          run_pv "$ARTEFACTS/VST3/$PRODUCT.vst3"
          if [ "$RUNNER_OS" = "macOS" ]; then run_pv "$ARTEFACTS/AU/$PRODUCT.component"; fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^project(LeeMeetII VERSION \([0-9.]*\).*/\1/p' "$PLUGIN_DIR/CMakeLists.txt")
          DIST="$GITHUB_WORKSPACE/dist"; mkdir -p "$DIST"
          package() {   # package <format-dir> <bundle-name> <zip-suffix>
            STAGE="$GITHUB_WORKSPACE/stage-$3"; rm -rf "$STAGE"; mkdir -p "$STAGE"
            cp -R "$ARTEFACTS/$1/$2" "$STAGE/"
            cp "$PLUGIN_DIR/README.md" "$STAGE/README.md"
            if [ "$RUNNER_OS" = "Windows" ]; then
              (cd "$STAGE" && 7z a -tzip "$DIST/Lee-Meet-II-$VERSION-$3.zip" . >/dev/null)
            else
              (cd "$STAGE" && zip -qry "$DIST/Lee-Meet-II-$VERSION-$3.zip" .)
            fi
          }
          case "$RUNNER_OS" in
            macOS)   package AU   "$PRODUCT.component" macOS-AU
                     package VST3 "$PRODUCT.vst3"      macOS-VST3 ;;
            Windows) package VST3 "$PRODUCT.vst3"      Windows-VST3 ;;
            Linux)   package VST3 "$PRODUCT.vst3"      Linux-VST3 ;;
          esac
          ls -la "$DIST"

      - uses: actions/upload-artifact@v4
        with:
          name: lee-meet-ii-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/lee-meet-ii-v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lee-Meet II ${GITHUB_REF_NAME#lee-meet-ii-v}" \
            --notes-file "$PLUGIN_DIR/RELEASE_NOTES.md"
