name: Deploy Supabase backend

# Manual. Applies migrations and the seed, sets Edge Function secrets and
# deploys the PCI Engine service. Requires repository secrets:
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
#   AI_API_KEY (and optionally AI_PROVIDER, AI_MODEL)
# The web build picks up the backend through repository variables
# NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: Apply supabase/seed.sql (idempotent)
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; exit 1; }
          test -n "${{ secrets.SUPABASE_PROJECT_REF }}" || { echo "::error::SUPABASE_PROJECT_REF secret is not set"; exit 1; }
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Apply seed
        if: ${{ inputs.seed }}
        run: supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD"
      - name: Edge Function secrets
        run: |
          supabase secrets set --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            AI_PROVIDER="${{ secrets.AI_PROVIDER || 'anthropic' }}" \
            AI_API_KEY="${{ secrets.AI_API_KEY }}" \
            AI_MODEL="${{ secrets.AI_MODEL || 'claude-opus-5' }}"
      - name: Deploy PCI Engine service
        run: supabase functions deploy pci-analyze --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
