name: Deploy to GitHub Pages

# Deploys the PCI Web App (web/) as a static site. Production deployment
# happens only after the canonical, functional, epistemic and security gates
# pass (§10.6). Public Supabase settings, if any, come from repository
# variables; secrets never enter the static build.
#
# Custom domain: set the repository variable PAGES_CUSTOM_DOMAIN (e.g.
# pci.academy) and the site builds for the domain root. Left unset, it builds
# for /<repository-name>/ on github.io.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Release gate
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm edge:check
      - name: Build
        run: pnpm build
        env:
          BASE_PATH: ${{ vars.PAGES_CUSTOM_DOMAIN == '' && format('/{0}/', github.event.repository.name) || '' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || (vars.PAGES_CUSTOM_DOMAIN != '' && format('https://{0}', vars.PAGES_CUSTOM_DOMAIN)) || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
