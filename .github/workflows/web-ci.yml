name: Web CI

# Release gates (§19.3) run on every change to the web app:
# lint · typecheck · unit + SQL/RLS tests · migrations · edge function · build · end-to-end.
on:
  pull_request:
    paths: ['web/**', '.github/workflows/web-ci.yml']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-ci.yml']

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit, regression-corpus and SQL/RLS tests
        run: pnpm test
      - name: Migrations apply and repeat cleanly
        run: pnpm db:migrate
      - name: Manuscript seeds match content/manuscript
        run: pnpm content:check
      - name: Seed is up to date
        run: pnpm db:seed && git diff --exit-code supabase/seed.sql
      - name: Edge Function shares the current engine
        run: pnpm edge:check
      - name: Edge Function typecheck and tests
        working-directory: web/supabase/functions
        run: |
          deno check --config pci-analyze/deno.json pci-analyze/index.ts
          deno test --config pci-analyze/deno.json --allow-env _shared/analyze.test.ts
      - name: Build (GitHub Pages base path)
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
