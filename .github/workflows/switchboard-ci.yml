name: Switchboard CI

on:
  push:
    paths: ["switchboard/**", ".github/workflows/switchboard-ci.yml"]
  pull_request:
    paths: ["switchboard/**", ".github/workflows/switchboard-ci.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: switchboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: switchboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t switchboard:ci switchboard
      - name: Smoke test container
        run: |
          docker run -d --name sb -p 3000:3000 -e ENABLE_MOCK_PROVIDER=true switchboard:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && break; sleep 1; done
          curl -fsS http://localhost:3000/api/health | grep '"status":"ok"'
          curl -fsS -N -X POST http://localhost:3000/api/chat -H 'content-type: application/json' \
            -d '{"settings":{"provider":"mock","model":"echo","systemPrompt":""},"message":{"content":"ci","attachments":[]}}' | grep '"type":"done"'
      - name: Container logs
        if: always()
        run: docker logs sb || true
