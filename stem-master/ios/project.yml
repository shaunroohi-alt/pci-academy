# Stem Master by MP Audio: iOS project definition for XcodeGen.
#
#   brew install xcodegen
#   cd stem-master/ios && xcodegen generate     # -> StemMaster.xcodeproj (git-ignored)
#   xcodebuild test -project StemMaster.xcodeproj -scheme StemMaster \
#     -destination 'platform=iOS Simulator,name=iPhone 16'
#
# The default server is the build setting STEM_MASTER_SERVER_URL, surfaced in
# Info.plist as SMDefaultServerURL. Override it per build without editing this
# file:  xcodebuild ... STEM_MASTER_SERVER_URL=https://my-gpu-box.example.com
# (In an .xcconfig file write it as  https:/$()/host  because // starts a comment.)
#
# The unit tests decode ../contract/job_completed.json, a real completed Job
# written by the server test-suite (SPEC section 4). Run the server tests first.

name: StemMaster

options:
  bundleIdPrefix: com.mpaudio
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    STEM_MASTER_SERVER_URL: https://mpindahouse-stem-master.hf.space
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    DEAD_CODE_STRIPPING: "YES"
    CODE_SIGN_STYLE: Automatic

targets:
  StemMaster:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StemMaster
        excludes:
          - Info.plist
          - Resources/PrivacyInfo.xcprivacy
      # App Store privacy manifest: required-reason APIs (UserDefaults, mach_absolute_time)
      # and the audio the app uploads to the configured server.
      - path: StemMaster/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: StemMaster/Info.plist
      properties:
        CFBundleDisplayName: Stem Master
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        SMDefaultServerURL: "$(STEM_MASTER_SERVER_URL)"
        UILaunchScreen:
          UIColorName: Background
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: >-
          Stem Master connects to a separation server on your local network
          when you enter one in Settings.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mpaudio.stemmaster
        PRODUCT_NAME: StemMaster
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"

  StemMasterTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StemMasterTests
      # Written by the server test-suite; decoded by ContractDecodingTests.
      - path: ../contract/job_completed.json
        buildPhase: resources
        optional: true
    dependencies:
      - target: StemMaster
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mpaudio.stemmaster.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StemMaster.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/StemMaster"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  StemMaster:
    build:
      targets:
        StemMaster: all
        StemMasterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - StemMaster
      targets:
        - name: StemMasterTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
